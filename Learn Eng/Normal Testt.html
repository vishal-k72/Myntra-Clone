            { english: "technical decision", hindi: "तकनीकी निर्णय" },
            { english: "personal preference", hindi: "व्यक्तिगत पसंद" },
            { english: "performance", hindi: "प्रदर्शन" },
            {
              english: "scalability",
              hindi: "बढ़ते load को संभालने की क्षमता",
            },
            {
              english: "maintainability",
              hindi: "आसानी से maintain करने की क्षमता",
            },
            { english: "constraints", hindi: "सीमाएँ" },
            { english: "matter", hindi: "मामला / विषय" },
            { english: "final decision", hindi: "अंतिम निर्णय" },
          ],
        },

        {
          hindi:
            "पिछले project में मुझे एक ऐसी समस्या का सामना करना पड़ा जिसे शुरू में समझना काफी मुश्किल था। मैंने problem को छोटे हिस्सों में divide किया और एक-एक करके possibilities को eliminate किया। कई बार solution काम नहीं किया, लेकिन मैंने हर attempt से कुछ सीखा। आखिरकार मुझे root cause मिला और मैंने issue को successfully resolve कर दिया।",

          english:
            "In my previous project, I faced a problem that was quite difficult to understand initially. I divided the problem into smaller parts and eliminated the possibilities one by one. Several attempts did not work, but I learned something from each attempt. Eventually, I found the root cause and successfully resolved the issue.",

          words: [
            { english: "previous project", hindi: "पिछला प्रोजेक्ट" },
            { english: "faced", hindi: "सामना किया" },
            { english: "initially", hindi: "शुरुआत में" },
            { english: "possibilities", hindi: "संभावनाएँ" },
            { english: "eliminate", hindi: "हटा देना" },
            { english: "attempts", hindi: "प्रयास" },
            { english: "eventually", hindi: "आखिरकार" },
            { english: "resolved", hindi: "समस्या का समाधान किया" },
          ],
        },

        {
          hindi:
            "एक professional environment में communication बहुत important है। अगर मैं किसी task को समय पर पूरा नहीं कर पाऊँगा, तो मैं आखिरी समय तक इंतजार नहीं करता। मैं पहले ही अपने manager या team को inform कर देता हूँ और delay का reason बताता हूँ। इससे team को plan adjust करने का समय मिल जाता है।",

          english:
            "Communication is very important in a professional environment. If I realize that I will not be able to complete a task on time, I do not wait until the last moment. I inform my manager or team in advance and explain the reason for the delay. This gives the team enough time to adjust the plan.",

          words: [
            {
              english: "professional environment",
              hindi: "व्यावसायिक वातावरण",
            },
            { english: "realize", hindi: "महसूस / पता चलना" },
            { english: "complete", hindi: "पूरा करना" },
            { english: "on time", hindi: "समय पर" },
            { english: "last moment", hindi: "आखिरी समय" },
            { english: "inform", hindi: "सूचित करना" },
            { english: "delay", hindi: "देरी" },
            { english: "adjust", hindi: "समायोजित करना" },
          ],
        },
      ];

      /*
      ==================================================
      VARIABLES
      ==================================================
      */

      const wordGrid = document.getElementById("wordGrid");
      const wordCount = document.getElementById("wordCount");
      const hindiSentence = document.getElementById("hindiSentence");
      const englishAnswer = document.getElementById("englishAnswer");
      const counter = document.getElementById("counter");
      const searchInput = document.getElementById("search");

      let paragraphMode = false;

      let currentSentence = 0;

      let selectedWords = [];

      /*
      ==================================================
      SHOW WORDS
      ==================================================
      */

      function renderWords(words = data.daily_use_english_words) {
        wordGrid.innerHTML = "";

        wordCount.textContent = `${words.length} words`;

        if (words.length === 0) {
          wordGrid.innerHTML = `
          <div class="empty">
            कोई word नहीं मिला।
          </div>
        `;

          return;
        }

        words.forEach((word) => {
          const card = document.createElement("div");

          card.className = "word-card";

          card.innerHTML = `
          <div class="english">
            ${word.english}
          </div>

          <div class="hindi">
            ${word.hindi}
          </div>
        `;

          /*
              Word पर click करने पर
              selected list में add होगा
              */

          card.addEventListener("click", () => {
            card.classList.toggle("selected");

            const index = selectedWords.indexOf(word.english);

            if (index === -1) {
              selectedWords.push(word.english);
            } else {
              selectedWords.splice(index, 1);
            }
          });

          wordGrid.appendChild(card);
        });
      }

      /*
      ==================================================
      SEARCH
      ==================================================
      */

      function searchWords() {
        const query = searchInput.value.trim().toLowerCase();

        if (!query) {
          renderWords();

          return;
        }

        const filtered = data.daily_use_english_words.filter(
          (word) =>
            word.english.toLowerCase().includes(query) ||
            word.hindi.toLowerCase().includes(query),
        );

        renderWords(filtered);
      }

      /*
      ==================================================
      SHOW SENTENCE
      ==================================================
      */

      function showSentence() {
        const sentence = sentences[currentSentence];

        hindiSentence.textContent = sentence.hindi;

        englishAnswer.textContent = sentence.english;

        englishAnswer.style.display = "none";

        counter.textContent = `Sentence ${currentSentence + 1} / ${sentences.length}`;
      }

      /*
==================================================
PARAGRAPH MODE
==================================================
*/

      function toggleParagraph() {
        paragraphMode = !paragraphMode;

        if (paragraphMode) {
          showParagraph();
        } else {
          showSentence();
        }
      }

      /*
==================================================
SHOW PARAGRAPH
==================================================
*/

      function showParagraph() {
        const paragraph = paragraphs[currentSentence % paragraphs.length];

        hindiSentence.textContent = paragraph.hindi;

        englishAnswer.textContent = paragraph.english;

        englishAnswer.style.display = "none";

        counter.textContent = `Paragraph ${currentSentence + 1} / ${paragraphs.length}`;
      }

      /*
==================================================
SHOW PARAGRAPH ANSWER
==================================================
*/

      function showParagraphAnswer() {
        const paragraph = paragraphs[currentSentence % paragraphs.length];

        let html = `
    <div style="margin-bottom:12px;">
      ${paragraph.english}
    </div>

    <div style="
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
      gap:8px;
    ">
  `;

        paragraph.words.forEach((word) => {
          html += `
      <div style="
        padding:10px;
        border-radius:8px;
        background:#black;
        border:1px solid #ffe8f0;
      ">
        <strong>${word.english}</strong>
        <br>
        <span>${word.hindi}</span>
      </div>
    `;
        });

        html += `</div>`;

        englishAnswer.innerHTML = html;

        englishAnswer.style.display = "block";
      }

      /*
      ==================================================
      NEXT
      ==================================================
      */

      function nextSentence() {
        currentSentence++;

        if (currentSentence >= sentences.length) {
          currentSentence = 0;
        }

        if (paragraphMode) {
          showParagraph();
        } else {
          showSentence();
        }
      }

      /*
      ==================================================
      PREVIOUS
      ==================================================
      */

      function previousSentence() {
        currentSentence--;

        if (currentSentence < 0) {
          currentSentence = sentences.length - 1;
        }

        if (paragraphMode) {
          showParagraph();
        } else {
          showSentence();
        }
      }

      /*
      ==================================================
      SHOW ANSWER
      ==================================================
      */

      function showAnswer() {
        if (paragraphMode) {
          showParagraphAnswer();
          return;
        }

        englishAnswer.style.display = "block";
      }

      /*
      ==================================================
      TEXT TO SPEECH
      ==================================================
      */

      function speakAnswer() {
        let text;

        if (paragraphMode) {
          text = paragraphs[currentSentence % paragraphs.length].english;
        } else {
          text = sentences[currentSentence].english;
        }

        if (!("speechSynthesis" in window)) {
          alert("आपके browser में speech सुविधा उपलब्ध नहीं है।");

          return;
        }

        window.speechSynthesis.cancel();

        const speech = new SpeechSynthesisUtterance(text);

        speech.lang = "en-US";

        speech.rate = 0.85;

        speech.pitch = 1;

        window.speechSynthesis.speak(speech);
      }

      /*
      ==================================================
      CLEAR SELECTED
      ==================================================
      */

      function clearSelected() {
        selectedWords = [];

        document.querySelectorAll(".word-card.selected").forEach((card) => {
          card.classList.remove("selected");
        });
      }

      /*
      ==================================================
      KEYBOARD SHORTCUTS
      ==================================================
      */

      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight") {
          nextSentence();
        }

        if (event.key === "ArrowLeft") {
          previousSentence();
        }

        if (event.key === " ") {
          /*
              Space दबाने पर answer show
              */

          if (document.activeElement.tagName !== "INPUT") {
            event.preventDefault();

            showAnswer();
          }
        }
      });

      /*
      ==================================================
      INITIAL LOAD
      ==================================================
      */

      renderWords();

      showSentence();
    </script>
  </body>
</html>
